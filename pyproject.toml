[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytsaurus-python-client"
version = "0.3.0"
description = "Lightweight Python helpers for YTsaurus, YQL, CHYT, and pandas workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Aleksey Voronko" }
]
keywords = ["ytsaurus", "yql", "chyt", "clickhouse", "pandas", "analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "urllib3>=1.26",
  "ytsaurus-client>=0.13",
]

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "pytest>=7.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["ytsaurus_python_client*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
